# Builds and updates Quotable's own Supabase back end: database tables and security
# rules, server secrets and server functions. No terminal needed.
#
# Runs in the public HarrisonGreener/quotable repo (where the site is published).
# One-time setup (repo Settings → Secrets and variables → Actions):
#   Secrets:   SUPABASE_ACCESS_TOKEN  (supabase.com/dashboard/account/tokens)
#              SUPABASE_DB_PASSWORD   (the database password chosen when creating the project)
#   Variables: SUPABASE_PROJECT_REF   (the xxxx in https://xxxx.supabase.co)
# Optional secrets passed to the server if present: GROQ_API_KEY, GEMINI_API_KEY,
# GEMINI_BILLING, STRIPE_SECRET_KEY, SMTP_USER, SMTP_PASSWORD, SMTP_FROM.
#
# Run it from the Actions tab → "Deploy back end" → Run workflow. It also runs by
# itself when database or function code changes on main.
name: Deploy back end

on:
  workflow_dispatch:
  push:
    branches: [main, leave-lovable]
    paths: ["supabase/migrations/**", "supabase/functions/**", "supabase/config.toml", "supabase/auth-emails/**"]

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  # Skip quietly until the project ID, access token and database password are all set
  ready:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          REF: ${{ vars.SUPABASE_PROJECT_REF }}
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPBABASE_ACCESS_TOKEN }}
          PW: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$REF" ] && [ -n "$TOKEN" ] && [ -n "$PW" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::Back end not deployed: add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD secrets and the SUPABASE_PROJECT_REF variable"; fi

  deploy:
    needs: ready
    if: ${{ needs.ready.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPBABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.40.7

      - name: Link the project
        run: |
          sed -i "s/^project_id = .*/project_id = \"$PROJECT_REF\"/" supabase/config.toml
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Build or update the database
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all

      - name: Server secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || secrets.STRIPE_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          GEMINI_BILLING: ${{ secrets.GEMINI_BILLING }}
        run: |
          # Only send the ones that are set; values never appear in the log
          args=()
          for k in GROQ_API_KEY GEMINI_API_KEY GEMINI_BILLING STRIPE_SECRET_KEY SMTP_USER SMTP_PASSWORD SMTP_FROM; do
            v="${!k}"
            [ -n "$v" ] && args+=("$k=$v")
          done
          args+=("SCRAPER_USER_AGENT=QuotableBot/1.0 (+https://quotable.uk)")
          supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}" > /dev/null
          echo "Set ${#args[@]} server secrets"

      - name: Account emails (branded templates and sender)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          python3 scripts/auth-email-config.py > /tmp/auth.json
          code=$(curl -s -o /tmp/auth-out.txt -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/auth.json)
          rm -f /tmp/auth.json
          if [ "$code" != "200" ]; then echo "::warning::Account email settings not applied ($code)"; head -c 300 /tmp/auth-out.txt; exit 0; fi
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASSWORD" ]; then echo "Branded emails on; sending through $SMTP_USER"; else echo "::notice::Add SMTP_USER and SMTP_PASSWORD secrets to send account emails from your own mailbox"; fi

      - name: Deploy server functions
        run: |
          supabase functions deploy --project-ref "$PROJECT_REF" --use-api

      - name: Remove retired server functions
        run: |
          # Functions deleted from the code are listed in supabase/retired-functions.txt
          grep -vE '^\s*(#|$)' supabase/retired-functions.txt | while read -r fn; do
            supabase functions delete "$fn" --project-ref "$PROJECT_REF" >/dev/null 2>&1 && echo "Removed $fn" || true
          done
